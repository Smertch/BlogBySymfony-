name: CI

on:
    push:
        branches: ['**']
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    PHP_VERSION: '8.3'
    PHP_EXTENSIONS: 'intl, pdo, pdo_pgsql, pgsql, mbstring, zip, bcmath, opcache, rdkafka'
    COMPOSER_NO_INTERACTION: '1'
    COMPOSER_PROCESS_TIMEOUT: '0'

jobs:
    composer-validate:
        name: composer validate
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  coverage: none
                  tools: composer:v2
            - run: composer validate --strict --no-check-publish

    lint:
        name: Lint (Twig + YAML + Container)
        runs-on: ubuntu-latest
        needs: composer-validate
        steps:
            - uses: actions/checkout@v4
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: ${{ env.PHP_EXTENSIONS }}
                  coverage: none
                  tools: composer:v2

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache composer dependencies
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'composer.json') }}
                  restore-keys: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Lint Twig templates
              run: php bin/console lint:twig templates --ansi

            - name: Lint YAML files
              run: php bin/console lint:yaml config translations --parse-tags --ansi

            - name: Lint DI container
              run: php bin/console lint:container --ansi
              env:
                  APP_ENV: dev

    cs-fixer:
        name: PHP-CS-Fixer (dry-run)
        runs-on: ubuntu-latest
        needs: composer-validate
        steps:
            - uses: actions/checkout@v4
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: ${{ env.PHP_EXTENSIONS }}
                  coverage: none
                  tools: composer:v2, cs2pr

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache composer dependencies
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'composer.json') }}
                  restore-keys: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run PHP-CS-Fixer
              run: vendor/bin/php-cs-fixer fix --dry-run --diff --format=checkstyle | cs2pr

    phpstan:
        name: PHPStan
        runs-on: ubuntu-latest
        needs: composer-validate
        steps:
            - uses: actions/checkout@v4
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: ${{ env.PHP_EXTENSIONS }}
                  coverage: none
                  tools: composer:v2

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache composer dependencies
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'composer.json') }}
                  restore-keys: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Warm dev container (needed by phpstan-symfony)
              run: php bin/console cache:warmup --env=dev --ansi

            - name: Run PHPStan
              run: vendor/bin/phpstan analyse --no-progress --error-format=github

    tests:
        name: PHPUnit
        runs-on: ubuntu-latest
        needs: composer-validate

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: blog_test
                    POSTGRES_USER: user
                    POSTGRES_PASSWORD: password
                ports: ['5432:5432']
                options: >-
                    --health-cmd="pg_isready -U user -d blog_test"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=12

        env:
            DATABASE_URL: 'postgresql://user:password@127.0.0.1:5432/blog_test?serverVersion=16&charset=utf8'
            APP_ENV: test
            APP_SECRET: ci-test-secret
            APP_NAME: Symfony
            APP_URL: http://localhost
            MAILER_DSN: 'null://null'
            MESSENGER_TRANSPORT_DSN: 'in-memory://'

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: ${{ env.PHP_EXTENSIONS }}
                  coverage: none
                  tools: composer:v2

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache composer dependencies
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'composer.json') }}
                  restore-keys: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run Doctrine migrations
              run: php bin/console doctrine:migrations:migrate --no-interaction --ansi

            - name: Validate Doctrine schema
              run: php bin/console doctrine:schema:validate --ansi

            - name: Run PHPUnit
              run: vendor/bin/phpunit --colors=always
