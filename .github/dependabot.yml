version: 2
updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
      open-pull-requests-limit: 10
      labels:
          - dependencies
          - php
      groups:
          symfony:
              patterns:
                  - 'symfony/*'
          doctrine:
              patterns:
                  - 'doctrine/*'
          dev-tooling:
              dependency-type: development
              patterns:
                  - 'phpstan/*'
                  - 'phpunit/*'
                  - 'friendsofphp/*'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
      labels:
          - dependencies
          - ci

    - package-ecosystem: docker
      directory: /docker/php-fpm
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
      labels:
          - dependencies
          - docker

    - package-ecosystem: docker
      directory: /docker/nginx
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
      labels:
          - dependencies
          - docker
