twig:
    default_path: '%kernel.project_dir%/templates'
    globals:
        app_name: '%env(APP_NAME)%'
        app_url: '%env(APP_URL)%'

when@dev:
    twig:
        # Avoid filesystem Twig cache in dev (Docker bind mounts often block mkdir/write under var/cache/*/twig).
        cache: false

when@test:
    twig:
        strict_variables: true
