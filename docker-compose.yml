name: blogbysymfony

services:
    mailhog:
        image: 'mailhog/mailhog:latest'
        ports:
            - '1526:8025'

    redis:
        image: 'redis:alpine'

    postgres:
        image: 'postgres:16-alpine'
        environment:
            POSTGRES_DB: blog
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
        volumes:
            - blogbysymfony_postgres_data:/var/lib/postgresql/data
        ports:
            - '1527:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U user -d blog']
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 30s

    kafka:
        image: 'apache/kafka:3.9.0'
        ports:
            # EXTERNAL listener: clients on the host use localhost:1529
            - '1529:9094'
        environment:
            # KRaft mode (no Zookeeper)
            KAFKA_NODE_ID: '1'
            KAFKA_PROCESS_ROLES: 'broker,controller'
            KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
            KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094'
            KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:1529'
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
            KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
            KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
            KAFKA_LOG_DIRS: '/var/lib/kafka/data'
        volumes:
            - blogbysymfony_kafka_data:/var/lib/kafka/data
        healthcheck:
            test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1']
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 45s

    kafka-ui:
        image: 'provectuslabs/kafka-ui:latest'
        ports:
            - '1530:8080'
        environment:
            KAFKA_CLUSTERS_0_NAME: blog-cluster
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:9092'
        depends_on:
            kafka:
                condition: service_healthy

    webserver:
        build: docker/nginx
        image: blogbysymfony-nginx
        pull_policy: never
        working_dir: /application
        depends_on:
            - php-fpm
        volumes:
            - '.:/application'
        ports:
            - '1525:80'

    php-fpm:
        build: docker/php-fpm
        image: blogbysymfony-php-fpm
        pull_policy: never
        working_dir: /application
        environment:
            APP_ENV: dev
            APP_DEBUG: '1'
            APP_NAME: Symfony
            APP_URL: 'http://localhost:1525'
            APP_LOCALE: en
            APP_FALLBACK_LOCALE: en
            DATABASE_URL: 'postgresql://user:password@postgres:5432/blog?serverVersion=16&charset=utf8'
            MAILER_DSN: 'smtp://mailhog:1025'
            MAIL_FROM_ADDRESS: 'hello@example.com'
            MAIL_FROM_NAME: 'Blog'
            MESSENGER_TRANSPORT_DSN: 'kafka://kafka:9092?topic=messages&group_id=blog&auto_offset_reset=earliest'
            REDIS_URL: 'redis://redis:6379'
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy
        volumes:
            - '.:/application'
            - './docker/php-fpm/php-ini-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini'

    queue-worker:
        build: docker/php-fpm
        image: blogbysymfony-php-fpm
        pull_policy: never
        working_dir: /application
        command: ['php', 'bin/console', 'messenger:consume', 'async', '-vv', '--time-limit=3600']
        restart: unless-stopped
        environment:
            APP_ENV: dev
            APP_DEBUG: '1'
            APP_NAME: Symfony
            APP_URL: 'http://localhost:1525'
            APP_LOCALE: en
            APP_FALLBACK_LOCALE: en
            DATABASE_URL: 'postgresql://user:password@postgres:5432/blog?serverVersion=16&charset=utf8'
            MAILER_DSN: 'smtp://mailhog:1025'
            MAIL_FROM_ADDRESS: 'hello@example.com'
            MAIL_FROM_NAME: 'Blog'
            MESSENGER_TRANSPORT_DSN: 'kafka://kafka:9092?topic=messages&group_id=blog&auto_offset_reset=earliest'
            REDIS_URL: 'redis://redis:6379'
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy
        volumes:
            - '.:/application'
            - './docker/php-fpm/php-ini-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini'

volumes:
    blogbysymfony_postgres_data:
    blogbysymfony_kafka_data:
