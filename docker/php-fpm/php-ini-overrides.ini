upload_max_filesize = 100M
post_max_size = 108M

; Twig lexer uses PREG_* heavily; PCRE JIT mis-compiles some patterns on certain
; PHP/libpcre builds (false “Unclosed variable” / “Unexpected end of template”
; when spaces precede {{ … }} with longer names). JIT off === lexer stable.
pcre.jit = 0

; Dev: pick up code changes without stale OPcache
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
